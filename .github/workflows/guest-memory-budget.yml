name: guest-memory-budget
on:
  push:
    branches: [runtime/guest-memory-budget]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guest-memory-budget-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: compat/tree/global.json
      - name: Prepare contributor check dependencies
        shell: bash
        run: |
          brew install bash ripgrep meson ninja pkg-config
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$pythonLocation/bin" >> "$GITHUB_PATH"
          echo "S2A_PY=$pythonLocation/bin/python3" >> "$GITHUB_ENV"
          python3 -m pip install -r tools/rewriter-requirements.txt
          python3 runtime/rewriter/prepare_deps.py build/rewriter-deps
          bash compat/fetch_base.sh
      - name: Regression and baseline negative controls
        shell: bash
        run: |
          mkdir -p build/ci-tests
          git show 8258fca5e9268078f5b8253b32336c4693d54bc1:runtime/src/layout.c > build/ci-tests/layout-before.c
          printf '\nuint64_t s2a_app_pool_native(void) { return s2a_app_pool(); }\n' >> build/ci-tests/layout-before.c
          git show 8258fca5e9268078f5b8253b32336c4693d54bc1:runtime/src/svc_mem.c > build/ci-tests/svc-before.c
          clang -std=gnu11 -O1 -g -DS2A_UNIT_TEST -Iruntime/include -Iruntime/src runtime/tests/t_app_pool.c build/ci-tests/layout-before.c -o build/ci-tests/t_app_pool_before
          if build/ci-tests/t_app_pool_before > build/ci-tests/budget-red.log 2>&1; then
            echo 'Budget negative control unexpectedly passed'
            exit 1
          fi
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror -DS2A_UNIT_TEST -Iruntime/include -Iruntime/src runtime/tests/t_app_pool.c runtime/src/layout.c -o build/ci-tests/t_app_pool
          build/ci-tests/t_app_pool > build/ci-tests/budget-green.log 2>&1
          make native-test-layout native-test-svc_mem native-test-app_pool_svc native-test-ios_guest_budget native-test-vawin_container > build/ci-tests/native.log 2>&1
          git show 8258fca5e9268078f5b8253b32336c4693d54bc1:runtime/src/vawin.c > build/ci-tests/vawin-before.c
          clang -std=gnu11 -O1 -g -DS2A_UNIT_TEST -Iruntime/include -Iruntime/src -o build/tests/t_container_restore_before runtime/tests/t_vawin_container.c build/ci-tests/vawin-before.c runtime/src/svc_mem.c runtime/src/loader.c runtime/src/layout.c runtime/src/programs.c runtime/src/imgpack.c -Wl,-undefined,dynamic_lookup -Wl,-weak_library,build/tests/libs2a_vaguard.dylib
          if S2A_APP_POOL_MB=2048 S2A_VAWIN_NORESERVE=1 build/tests/t_container_restore_before --budget > build/ci-tests/container-restore-red.log 2>&1; then
            echo 'Container native pool restore negative control unexpectedly passed'
            exit 1
          fi
          clang -std=gnu11 -O1 -g -DS2A_UNIT_TEST -Iruntime/include -Iruntime/src -o build/tests/t_container_npdm_before runtime/tests/t_vawin_container.c runtime/src/vawin.c build/ci-tests/svc-before.c runtime/src/loader.c runtime/src/layout.c runtime/src/programs.c runtime/src/imgpack.c -Wl,-undefined,dynamic_lookup -Wl,-weak_library,build/tests/libs2a_vaguard.dylib
          if S2A_APP_POOL_MB=2048 S2A_VAWIN_NORESERVE=1 build/tests/t_container_npdm_before --budget > build/ci-tests/container-npdm-red.log 2>&1; then
            echo 'Container NPDM pool negative control unexpectedly passed'
            exit 1
          fi
          clang -std=gnu11 -O1 -g -DS2A_UNIT_TEST -Iruntime/include -Iruntime/src runtime/tests/t_app_pool_svc.c build/ci-tests/svc-before.c build/ci-tests/layout-before.c build/tests/libs2a_vaguard.dylib -o build/tests/t_app_pool_svc_before
          if build/tests/t_app_pool_svc_before > build/ci-tests/svc-red.log 2>&1; then
            echo 'SVC negative control unexpectedly passed'
            exit 1
          fi
          clang -std=gnu11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -DS2A_UNIT_TEST -Iruntime/include -Iruntime/src runtime/tests/t_app_pool.c runtime/src/layout.c -o build/ci-tests/t_app_pool_sanitized
          build/ci-tests/t_app_pool_sanitized > build/ci-tests/sanitized.log 2>&1
          xcrun --sdk iphoneos clang -target arm64-apple-ios18.0 -fsyntax-only -Iruntime/include runtime/src/layout.c runtime/src/svc_mem.c > build/ci-tests/ios-syntax.log 2>&1
          xcrun --sdk iphoneos clang -target arm64-apple-ios18.0 -fsyntax-only ios/guest_budget.m >> build/ci-tests/ios-syntax.log 2>&1
      - name: Contributor first-layer check
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          CONTRIB_BASE_RERUN=1 bash tools/contrib_check.sh --base 8258fca5e9268078f5b8253b32336c4693d54bc1 > build/ci-tests/contrib.log 2>&1
      - name: Upload checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-memory-budget-checks
          retention-days: 7
          path: |
            build/ci-tests/*.log
            build/contrib_check/summary.md
            build/contrib_check/*.log
            build/contrib_check/*.err
            build/tests/present-settings/**/run.log
